[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shio-lang"
version = "0.6.0"
description = "Shio: a language for agents in which the model reads and code decides. Checks double as training rewards."
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-APACHE", "LICENSE-MIT"]
authors = [{ name = "Aonami Labs" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

keywords = ["llm", "ai-agents", "prompt-injection", "programming-language", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/pratikkp24/shio"
Documentation = "https://pratikkp24.github.io/shio/"
Changelog = "https://github.com/pratikkp24/shio/blob/main/CHANGELOG.md"
Source = "https://github.com/pratikkp24/shio"
Issues = "https://github.com/pratikkp24/shio/issues"
Security = "https://github.com/pratikkp24/shio/blob/main/SECURITY.md"

[project.optional-dependencies]
regulated = ["cryptography>=42"]
anthropic = ["anthropic>=1.0"]
s3 = ["boto3>=1.34"]
otel = ["opentelemetry-api>=1.24"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10"]
pdf = ["pypdf>=4"]
train = ["trl>=0.20", "datasets", "peft"]

[project.scripts]
shio = "shio.cli:main"

[tool.setuptools]
packages = ["shio"]

[tool.setuptools.package-data]
shio = ["*.shio"]
