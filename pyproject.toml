[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shio-lang"
version = "0.1.0"
description = "Shio: a language for agents in which the model reads and code decides. Checks double as training rewards."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aonami Labs" }]
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

keywords = ["llm", "ai-agents", "prompt-injection", "programming-language", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers",
]

[project.urls]
Homepage = "https://github.com/pratikkp24/shio"
Source = "https://github.com/pratikkp24/shio"
Issues = "https://github.com/pratikkp24/shio/issues"
Security = "https://github.com/pratikkp24/shio/blob/main/SECURITY.md"

[project.optional-dependencies]
regulated = ["cryptography>=42"]
pdf = ["pypdf>=4"]
train = ["trl>=0.20", "datasets", "peft"]

[project.scripts]
shio = "shio.cli:main"

[tool.setuptools]
packages = ["shio"]
