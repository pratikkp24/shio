name: release
# Publishes to PyPI when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Uses PyPI trusted publishing: no token is stored in the repository. One-time setup on pypi.org:
#   Your projects -> shio-lang -> Publishing -> add a GitHub publisher:
#   owner pratikkp24, repository shio, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the tag matches the package version
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but pyproject says $v"; exit 1; }
          grep -q "__version__ = \"$v\"" shio/__init__.py || { echo "shio/__init__.py version differs"; exit 1; }
      - run: pip install -e ".[regulated,pdf]" pytest build twine
      - run: pytest -q
      - run: python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
